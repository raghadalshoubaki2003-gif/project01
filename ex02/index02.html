<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
</head>
<body>
    <h1>My Profile</h1>
    <img src="assets/profile.jpg" alt="Profile photo">
    <p><a href="https://github.com/" target="_blank" rel="noopener noreferrer">Visit my GitHub</a></p>
    <p><a href="#contact">Go to Contact</a></p>
    <h2 id="contact">Contact</h2>
    <p><a href="mailto:example@example.com">Send me an email</a></p>
</body>
</html>
